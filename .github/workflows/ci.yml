name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Линтер (ESLint + контракты проекта)
        run: npm run lint

      - name: Сборка и проверка метаданных userscript
        run: npm run check

      - name: Проверка, что dist/infinder.user.js соответствует исходникам
        run: git diff --exit-code -- dist
